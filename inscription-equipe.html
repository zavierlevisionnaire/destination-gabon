<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un accès équipe | Destination Gabon</title><style>body{font:15px system-ui;background:#f2f6f3;color:#183526;margin:0}header{background:#103321;color:white;padding:22px 5%}main{max-width:560px;margin:35px auto;padding:0 15px}.card{background:white;border:1px solid #dce8df;border-radius:12px;padding:22px}label{display:block;font-weight:bold;font-size:12px;margin-top:12px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dce5de;border-radius:8px;margin:5px 0}button{background:#087a45;color:white;border:0;border-radius:8px;padding:12px 16px;margin-top:15px;cursor:pointer}.muted{font-size:12px;color:#718078}</style><header><b>DESTINATION GABON · RECRUTEMENT ÉQUIPE</b></header><main><div class="card"><h2>Créer un compte membre</h2><p class="muted">Ce formulaire crée uniquement un identifiant. Aucun droit de guide n’est accordé automatiquement. L’administrateur national attribuera ensuite le rôle et le territoire.</p><form id="f"><label>Nom complet</label><input id="n" required><label>Adresse e-mail</label><input id="e" type="email" required><label>Mot de passe (8 caractères minimum)</label><input id="p" type="password" minlength="8" required><button>Créer mon compte</button></form><p id="m" class="muted"></p><p class="muted"><a href="admin.html">Administration nationale</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>const db=supabase.createClient(DG_SUPABASE_URL,DG_SUPABASE_ANON_KEY);document.getElementById('f').onsubmit=async x=>{x.preventDefault();const m=document.getElementById('m');m.textContent='Création du compte…';const {data,error}=await db.auth.signUp({email:document.getElementById('e').value.trim(),password:document.getElementById('p').value,options:{data:{full_name:document.getElementById('n').value.trim()}}});if(error){m.textContent=error.message;return}m.textContent=data.session?'Compte créé. Contactez l’administrateur national pour obtenir votre rôle et votre affectation.':'Compte créé. Vérifiez votre boîte e-mail pour confirmer votre adresse, puis contactez l’administrateur national pour obtenir votre rôle et votre affectation.';document.getElementById('f').reset()};</script></main></html>
